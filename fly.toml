# fly launch --no-deploy --copy-config   then   fly volumes create data --size 1
app = "leafy-ils"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "/data/library.db"
  # ORIGIN must match the public URL, otherwise auth cookies are rejected.
  ORIGIN = "https://leafy-ils.fly.dev"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
